<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rewards & transactions | EcoVault Admin</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="auth-pending">
  <div class="auth-loader">Checking login…</div>

  <div id="app" class="app">
    <!-- Sidebar + header are filled by js/components/layout.js -->
    <aside id="sidebar"></aside>

    <main>
      <header class="top" id="pageHeader"></header>

      <!-- ================= REWARDS ================= -->
      <div class="stats">
        <div class="stat"><label>Points issued</label><strong id="rwIssued">0</strong></div>
        <div class="stat"><label>Points redeemed</label><strong id="rwRedeemed">0</strong></div>
        <div class="stat"><label>Pending vouchers</label><strong id="rwPending">0</strong></div>
        <div class="stat"><label>Vouchers issued</label><strong id="rwVouchers">0</strong></div>
      </div>

      <div class="card">
        <h2>Reward transactions</h2>
        <div class="sub">Audit points and voucher activity</div>
        <div class="tablewrap">
          <table>
            <thead><tr><th>Transaction</th><th>User</th><th>Activity</th><th>Points</th><th>Date</th><th>Status</th></tr></thead>
            <tbody id="rewardsTable"></tbody>
          </table>
        </div>
        <p class="smallnote">In production, point calculation and voucher redemption must be validated by secured backend logic.</p>
      </div>
    </main>
  </div>

  <div id="modalHost"></div>
  <div id="toast" class="toast hidden"></div>

  <script type="module" src="../js/pages/rewards.js"></script>
</body>
</html>
