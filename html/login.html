<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login | EcoVault</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>
  <div class="login">
    <form class="loginbox" id="loginForm" novalidate>
      <div class="brand">♻ EcoVault</div>
      <div class="muted">IoT Based Smart E-Waste Bin · Admin</div>

      <h1>Sign in</h1>
      <p class="muted">Use your admin account to open the dashboard.</p>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" placeholder="admin@example.com" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
          <button type="button" class="toggle-pass" id="togglePass">Show</button>
        </div>
      </div>

      <div class="login-row">
        <label><input type="checkbox" id="remember" checked> Remember me</label>
        <button type="button" class="linkbtn" id="forgotPass">Forgot password?</button>
      </div>

      <button class="primary wide" id="loginBtn">Sign in</button>

      <div id="loginMsg" class="form-msg hidden"></div>
    </form>
  </div>

  <script type="module" src="../js/login.js"></script>
</body>
</html>
