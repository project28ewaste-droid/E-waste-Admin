<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dustbin monitoring | EcoVault Admin</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="auth-pending">
  <div class="auth-loader">Checking login…</div>

  <div id="app" class="app">
    <!-- Sidebar + header are filled by js/components/layout.js -->
    <aside id="sidebar"></aside>

    <main>
      <header class="top" id="pageHeader"></header>

      <!-- ================= DUSTBINS ================= -->
      <div class="stats">
        <div class="stat"><label>Total bins</label><strong id="binTotal">0</strong></div>
        <div class="stat"><label>Online</label><strong id="binOnline">0</strong></div>
        <div class="stat"><label>Offline</label><strong id="binOffline">0</strong></div>
        <div class="stat"><label>Need collection</label><strong id="pickupCount">0</strong></div>
      </div>

      <div class="card">
        <div class="cardhead">
          <div><h2>Dustbin monitoring</h2><div class="sub">One row per ESP32 bin (MAC address) · online status checked live</div></div>
          <button class="primary" id="setLocation">✎ Set bin location</button>
        </div>
        <div class="toolbar">
          <input class="grow" id="binSearch" placeholder="Search MAC address or location">
          <select id="binFilter">
            <option value="all">All statuses</option>
            <option>Online</option>
            <option>Offline</option>
            <option>Checking…</option>
          </select>
        </div>
        <div class="tablewrap">
          <table>
            <thead><tr><th>🗑️ Bin (MAC) / location</th><th>Weight</th><th>Fill</th><th>Temperature</th><th>Last reply</th><th>Status</th></tr></thead>
            <tbody id="binsTable"></tbody>
          </table>
        </div>
        <p class="smallnote">Each bin is asked “Hi” every 30 seconds; it shows Online when the ESP32 answers “am there”. Select a row for full details.</p>
      </div>
    </main>
  </div>

  <div id="modalHost"></div>
  <div id="toast" class="toast hidden"></div>

  <script type="module" src="../js/pages/bins.js"></script>
</body>
</html>
