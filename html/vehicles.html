<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vehicle collection history | EcoVault Admin</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="auth-pending">
  <div class="auth-loader">Checking login…</div>

  <div id="app" class="app">
    <!-- Sidebar + header are filled by js/components/layout.js -->
    <aside id="sidebar"></aside>

    <main>
      <header class="top" id="pageHeader"></header>

      <!-- ================= VEHICLES ================= -->
      <div class="stats">
        <div class="stat"><label>Total trips</label><strong id="tripTotal">0</strong></div>
        <div class="stat"><label>Completed</label><strong id="tripDone">0</strong></div>
        <div class="stat"><label>Scheduled</label><strong id="tripScheduled">0</strong></div>
        <div class="stat"><label>Weight transported</label><strong id="tripWeight">0 kg</strong></div>
      </div>

      <div class="card">
        <div class="cardhead">
          <div><h2>Vehicle collection history</h2><div class="sub">Track how many times vehicles service each bin</div></div>
          <button class="primary" id="addTrip">+ Schedule collection</button>
        </div>
        <div class="toolbar">
          <input class="grow" id="tripSearch" placeholder="Search trip, vehicle, driver or bin">
          <select id="tripFilter">
            <option value="all">All statuses</option>
            <option>Scheduled</option>
            <option>Completed</option>
            <option>Cancelled</option>
          </select>
        </div>
        <div class="tablewrap">
          <table>
            <thead><tr><th>Trip ID</th><th>Vehicle number</th><th>Driver</th><th>Bins serviced</th><th>Weight</th><th>Date/time</th><th>Status</th></tr></thead>
            <tbody id="tripsTable"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div id="modalHost"></div>
  <div id="toast" class="toast hidden"></div>

  <script type="module" src="../js/pages/vehicles.js"></script>
</body>
</html>
